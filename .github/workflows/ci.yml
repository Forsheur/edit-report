name: ci

# Development happens on macOS Apple Silicon. Windows and Linux binaries are
# built here and never on a developer machine, so what ships is what a clean
# checkout produces.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A verification tool has no business emitting a warning it decided to ignore.
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all

  # The core must keep compiling to wasm32 from the first commit. Finding out
  # at milestone 2 that something pulled in an incompatible dependency would
  # mean unpicking it after the fact.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p edit-report-core --target wasm32-unknown-unknown --release

  # End-to-end against a real bundle, on the one platform where installing
  # ffmpeg and Python is a one-liner. Proves the parts fit together, which no
  # unit test does.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo build --release
      - name: Run against the checked-in fixture bundle
        run: |
          if [ -d fixtures/bundles ] && [ -n "$(ls -A fixtures/bundles 2>/dev/null)" ]; then
            ./target/release/edit-report --bundle fixtures/bundles/* --json /tmp/r.json
            python3 -c "import json;d=json.load(open('/tmp/r.json'));assert d['schema']=='forsheur-edit-report/1';assert d['limits']"
          else
            echo "no fixture bundle committed — see fixtures/README.md"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wasm]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: edit-report-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: edit-report-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: edit-report-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: edit-report-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # --locked: build from the committed Cargo.lock or fail. A release that
      # quietly resolved a different dependency set is not the thing that was
      # reviewed.
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name and hash the artefact
        shell: bash
        run: |
          mkdir -p dist
          src=target/${{ matrix.target }}/release/edit-report
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "dist/${{ matrix.name }}"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          else
            shasum -a 256 "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          fi
          cat "${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/
