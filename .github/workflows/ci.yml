name: ci

# Development happens on macOS Apple Silicon. Windows and Linux binaries are
# built here and never on a developer machine, so what ships is what a clean
# checkout produces.

on:
  push:
    # Both, because the repository's default branch is `master` and a workflow
    # that silently never runs is worse than no workflow.
    branches: [main, master]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A verification tool has no business emitting a warning it decided to ignore.
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # `rustup show` installs exactly what rust-toolchain.toml names —
      # version, components and targets. Naming a toolchain in the workflow
      # instead would give two places to change it and one of them would
      # eventually be wrong.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all

  # The core must keep compiling to wasm32 from the first commit. Finding out
  # at milestone 2 that something pulled in an incompatible dependency would
  # mean unpicking it after the fact.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p edit-report-core --target wasm32-unknown-unknown --release
      # And that the single file still assembles. It is the artefact most
      # likely to break silently: nothing else exercises the module
      # stripping, and a page that fails to build is only noticed at
      # release time otherwise.
      - run: ./web/build-single.sh
      - name: The page must reach nothing
        run: |
          grep -qE 'src="http|href="http|@import|fetch\("http' dist/edit-report.html \
            && { echo 'the page addresses a host'; exit 1; } || true
          grep -q '__EDIT_REPORT_WASM__' dist/edit-report.html
      # The same commit from a second directory must give the same bytes.
      # This is the property the published hash rests on, and it was lost
      # once without anything noticing: a symbol suffix derived from the
      # object path, which the remap flags never touched. Now it is a test.
      - name: The page must not depend on where it was built
        run: |
          mkdir -p /tmp/elsewhere
          git archive HEAD | tar -x -C /tmp/elsewhere
          (cd /tmp/elsewhere && ./web/build-single.sh)
          a=$(sha256sum dist/edit-report.html | cut -d' ' -f1)
          b=$(sha256sum /tmp/elsewhere/dist/edit-report.html | cut -d' ' -f1)
          echo "here:      $a"
          echo "elsewhere: $b"
          [ "$a" = "$b" ] || { echo 'the build depends on its directory'; exit 1; }

  # End-to-end against a real bundle, on the one platform where installing
  # ffmpeg and Python is a one-liner. Proves the parts fit together, which no
  # unit test does.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo build --release
      - name: Run against the checked-in fixture bundle
        run: |
          if [ -d fixtures/bundles ] && [ -n "$(ls -A fixtures/bundles 2>/dev/null)" ]; then
            ./target/release/edit-report --bundle fixtures/bundles/* --json /tmp/r.json
            python3 -c "import json;d=json.load(open('/tmp/r.json'));assert d['schema']=='forsheur-edit-report/1';assert d['limits']"
          else
            echo "no fixture bundle committed — see fixtures/README.md"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wasm]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: edit-report-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: edit-report-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: edit-report-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: edit-report-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      # Paths out of the binary, or it carries the runner's home directory
      # and the published hash is one nobody else can reproduce. Computed
      # here rather than written as a literal because $HOME and the
      # workspace path are the runner's, not ours.
      - name: Reproducible build flags
        shell: bash
        run: |
          echo "RUSTFLAGS=-D warnings"\
               " --remap-path-prefix=$HOME/.rustup=/rustup"\
               " --remap-path-prefix=$HOME/.cargo=/cargo"\
               " --remap-path-prefix=$PWD=/src" >> "$GITHUB_ENV"
      # --locked: build from the committed Cargo.lock or fail. A release that
      # quietly resolved a different dependency set is not the thing that was
      # reviewed.
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name and hash the artefact
        shell: bash
        run: |
          mkdir -p dist
          src=target/${{ matrix.target }}/release/edit-report
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "dist/${{ matrix.name }}"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          else
            shasum -a 256 "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          fi
          cat "${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/

  # The browser build, which is one file and therefore one hash. Built on
  # Linux only: the target is wasm32, so the host does not enter into it, and
  # building it four times would invite four different answers to a question
  # that has one.
  release-web:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: ./web/build-single.sh
      - name: Refuse a page that carries the runner's paths
        run: |
          if grep -q "$HOME" dist/edit-report.html; then
            echo "the page embeds $HOME — the hash would not be reproducible"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: edit-report.html
          path: dist/

  # One release, everything in it, hashes for all of it, and a signed
  # statement of where it came from.
  #
  # Actions artefacts expire after 90 days and need a GitHub account to
  # download. A tool whose whole argument is that a reader can check it for
  # themselves cannot be distributed behind a login that forgets.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, release-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance
      attestations: write    # record it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Collect and hash
        run: |
          mkdir -p out
          find staging -type f ! -name '*.sha256' -exec cp {} out/ \;
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # Signs "these files were produced by this workflow, from this commit",
      # into a public transparency log. Checkable with:
      #     gh attestation verify <file> --repo ${{ github.repository }}
      # It says where a file came from. It does not say the file is honest,
      # and nothing here could.
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'out/*'
      # `gh` rather than a third-party action: in a tool meant to be audited,
      # every action in this file is something a reader has to go and read.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --title "${{ github.ref_name }}" \
            --notes "$(cat <<'NOTES'
          Built by CI from this tag. `SHA256SUMS` covers every file here.

          **edit-report.html** is the browser build: one file, no network, runs
          from `file://`. Save it, check its hash, and it keeps working offline
          for as long as you keep it.

          To verify where these files came from:

              gh attestation verify <file> --repo ${{ github.repository }}

          To verify they match the source, build the tag yourself — the
          toolchain is pinned in `rust-toolchain.toml` and paths are remapped
          out, so `./web/build-single.sh` should reproduce the same bytes. If
          it does not, that is worth reporting.
          NOTES
          )"
